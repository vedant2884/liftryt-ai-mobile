org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Works around a reproducible Kotlin incremental-compiler crash on Windows
# (PersistentHashMap fails to close its .tab files under
# build/<module>/kotlin/compileDebugKotlin/cacheable/caches-jvm) seen with
# plugins that ship native Kotlin sources (e.g. shared_preferences_android).
# Full non-incremental Kotlin compilation is slightly slower per build but
# reliable; re-evaluate if a future AGP/Kotlin version fixes the underlying
# issue upstream.
kotlin.incremental=false
